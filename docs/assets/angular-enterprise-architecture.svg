        <rect width="270" height="96" rx="10" fill="url(#cardBg)" stroke="#566874"/>
        <rect x="17" y="20" width="34" height="34" rx="8" fill="#0f2027" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <g transform="translate(34 37)">
