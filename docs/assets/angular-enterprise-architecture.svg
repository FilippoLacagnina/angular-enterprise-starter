          <circle cx="6" cy="-5" r="3.4" class="icon-stroke"/>
          <circle cx="6" cy="5" r="3.4" class="icon-stroke"/>
          <path d="M-2.5 -1L2.5 -3.5M-2.5 1L2.5 3.5" class="icon-stroke"/>
        </g>
