        <text x="66" y="72" class="bullet">- Header</text>
        <text x="66" y="92" class="bullet">- Sidebar</text>
        <text x="66" y="112" class="bullet">- Main</text>
        <text x="66" y="132" class="bullet">- Footer</text>
      </g>

