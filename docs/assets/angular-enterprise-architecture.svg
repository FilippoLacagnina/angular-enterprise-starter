      <path d="M32 8L56 22V52L32 66L8 52V22L32 8Z" fill="#c3002f"/>
      <text x="32" y="49" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">A</text>
