    <g transform="translate(60 682)">
      <rect width="1256" height="56" rx="12" fill="#17262d" stroke="#2dd4bf" stroke-opacity="0.5" stroke-dasharray="7 7"/>
      <rect x="24" y="12" width="32" height="32" rx="8" fill="#0f2027" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <g transform="translate(40 28)">
        <path d="M-8 0L-2 6L9 -7" class="icon-stroke"/>
      </g>
      <text x="76" y="35" class="card-title">CI Quality Gate</text>
