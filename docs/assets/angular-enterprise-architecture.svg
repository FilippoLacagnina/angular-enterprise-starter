      <line x1="504" y1="16" x2="504" y2="40" stroke="#64748b"/>
      <text x="574" y="35" class="bullet">Lint</text>
      <line x1="672" y1="16" x2="672" y2="40" stroke="#64748b"/>
      <text x="740" y="35" class="bullet">Typecheck</text>
      <line x1="888" y1="16" x2="888" y2="40" stroke="#64748b"/>
      <text x="958" y="35" class="bullet">Build</text>
