        </g>
        <text x="68" y="36" class="card-title">Shared</text>
        <text x="68" y="68" class="bullet">- Components</text>
        <text x="68" y="90" class="bullet">- Directives</text>
        <text x="68" y="112" class="bullet">- Pipes</text>
        <text x="68" y="134" class="bullet">- Utilities</text>
      </g>

      <g transform="translate(20 294)">
        <rect width="432" height="76" rx="10" fill="url(#cardBg)" stroke="#566874"/>
        <rect x="20" y="23" width="30" height="30" rx="7" fill="#0f2027" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <g transform="translate(35 38)">
          <path d="M-8 3C-11 3 -13 0.8 -13 -1.5C-13 -4 -10.5 -6 -7.5 -5C-6.5 -9.5 -2.8 -11 1 -9.5C3.2 -8.6 4.8 -6.8 5.8 -5C9.5 -5 12.5 -2.4 12.5 0.8C12.5 3.2 10 5 6.8 5H-8" class="icon-stroke"/>
        </g>
        <text x="68" y="34" class="card-title">Configuration</text>
        <text x="68" y="62" class="bullet">- environments</text>
        <text x="250" y="62" class="bullet">- values.yml</text>
      </g>

      <g transform="translate(20 394)">
        <rect width="432" height="76" rx="10" fill="url(#cardBg)" stroke="#566874"/>
        <rect x="18" y="21" width="34" height="34" rx="8" fill="#0f2027" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <g transform="translate(35 38)">
