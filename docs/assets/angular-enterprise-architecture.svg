        <rect x="18" y="18" width="34" height="34" rx="8" fill="#0f2027" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <g transform="translate(35 35)">
          <path d="M-9 -6H1C6 -6 9 -3 9 2V8H-9V-6ZM-2 -6V-10H9" class="icon-stroke"/>
        </g>
