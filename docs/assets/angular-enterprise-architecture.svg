        <text x="68" y="68" class="bullet">- Config</text>
        <text x="68" y="90" class="bullet">- API routes</text>
        <text x="68" y="112" class="bullet">- Guards</text>
        <text x="68" y="134" class="bullet">- Interceptors</text>
        <text x="68" y="156" class="bullet">- Tokens</text>
      </g>

