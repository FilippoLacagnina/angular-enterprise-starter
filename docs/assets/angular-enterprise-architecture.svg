<svg width="1376" height="768" viewBox="0 0 1376 768" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Angular Enterprise Starter Architecture</title>
  <desc id="desc">Terminal-style architecture diagram for Angular Enterprise Starter showing experience and shell, feature domains, foundation boundaries and CI quality gate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1376" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1720"/>
      <stop offset="0.48" stop-color="#14272f"/>
      <stop offset="1" stop-color="#0e1b22"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24343b"/>
      <stop offset="1" stop-color="#17262d"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2d34"/>
      <stop offset="1" stop-color="#102128"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1376" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1376" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
      .title { fill: #e2e8f0; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 22px; }
      .panel-title { fill: #e2e8f0; font-size: 22px; font-weight: 800; }
      .card-title { fill: #e2e8f0; font-size: 19px; font-weight: 800; }
      .bullet { fill: #cbd5e1; font-size: 13px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 13px; font-weight: 600; }
      .icon-stroke { stroke: #2dd4bf; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .icon-red { stroke: #fb7185; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .muted-line { stroke: #42515b; }
    </style>
  </defs>

  <rect width="1376" height="768" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1374" height="766" rx="29" stroke="#2dd4bf" stroke-opacity="0.12"/>

  <g opacity="0.18">
    <path d="M1058 42L1240 152L1324 104" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M1128 28L1320 146L1320 340" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M30 624L190 714L346 646" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="1168" cy="118" r="108" stroke="#94a3b8" stroke-width="1.2"/>
  </g>

