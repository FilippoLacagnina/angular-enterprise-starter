          <circle cx="-6" cy="-5" r="2.5" class="icon-red"/>
          <circle cx="6" cy="5" r="2.5" class="icon-red"/>
        </g>
        <text x="68" y="34" class="card-title">Microservice APIs</text>
        <text x="68" y="62" class="bullet">- Versioned endpoints</text>
        <text x="260" y="62" class="bullet">- Service routes</text>
