        <text x="68" y="70" class="bullet">- Same structure</text>
        <text x="68" y="94" class="bullet">- Isolated domain</text>
        <text x="68" y="118" class="bullet">- Lazy loaded</text>
      </g>
    </g>

    <g transform="translate(836 162)">
