<svg width="760" height="940" viewBox="0 0 760 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Angular Enterprise Starter Evolution CLI preview</title>
  <desc id="desc">Terminal-style preview of the Angular Enterprise Starter Evolution CLI showing installable Transloco i18n, SignalStore, Docker SSR, Bootstrap and Tailwind evolutions.</desc>
  <rect width="760" height="940" rx="22" fill="#17252B"/>
  <rect x="1" y="1" width="758" height="938" rx="21" stroke="#29424B" stroke-width="2"/>

  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="38" y="38" width="684" height="138" rx="6" stroke="#34D6C3" stroke-width="2.5"/>
    <text x="380" y="83" fill="#D8E2EA" font-size="25" font-weight="700" text-anchor="middle">ANGULAR ENTERPRISE STARTER</text>
    <text x="380" y="122" fill="#D8E2EA" font-size="20" font-weight="700" text-anchor="middle">Evolution CLI</text>
    <text x="380" y="150" fill="#7E8B96" font-size="18" text-anchor="middle">v0.5.1-alpha.0</text>

    <text x="34" y="250" fill="#C8D3DC" font-size="20" font-weight="700">Modular Angular starter capabilities.</text>
    <text x="34" y="286" fill="#C8D3DC" font-size="20" font-weight="700">Preview first. </text>
    <text x="206" y="286" fill="#62D96B" font-size="20" font-weight="700">Apply</text>
    <text x="276" y="286" fill="#C8D3DC" font-size="20" font-weight="700"> when ready.</text>

    <line x1="34" y1="380" x2="726" y2="380" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>
    <text x="34" y="427" fill="#D8E2EA" font-size="20" font-weight="700">Choose an evolution</text>
    <line x1="34" y1="459" x2="726" y2="459" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>

    <text x="34" y="510" fill="#34D6C3" font-size="20" font-weight="700">1.</text>
    <text x="70" y="510" fill="#D8E2EA" font-size="20" font-weight="700">Transloco i18n</text>
    <text x="70" y="550" fill="#7E8B96" font-size="20">Runtime i18n baseline with EN/IT assets.</text>

    <text x="34" y="590" fill="#34D6C3" font-size="20" font-weight="700">2.</text>
    <text x="70" y="590" fill="#D8E2EA" font-size="20" font-weight="700">SignalStore</text>
    <text x="70" y="630" fill="#7E8B96" font-size="20">Feature/root NgRx SignalStore baseline.</text>

    <text x="34" y="670" fill="#34D6C3" font-size="20" font-weight="700">3.</text>
    <text x="70" y="670" fill="#D8E2EA" font-size="20" font-weight="700">Docker SSR</text>
    <text x="70" y="710" fill="#7E8B96" font-size="20">SSR-oriented Docker deployment baseline.</text>

    <text x="34" y="750" fill="#34D6C3" font-size="20" font-weight="700">4.</text>
    <text x="70" y="750" fill="#D8E2EA" font-size="20" font-weight="700">Bootstrap</text>
    <text x="70" y="790" fill="#7E8B96" font-size="20">Parametrized Bootstrap UI primitives.</text>

    <text x="34" y="830" fill="#34D6C3" font-size="20" font-weight="700">5.</text>
    <text x="70" y="830" fill="#D8E2EA" font-size="20" font-weight="700">Tailwind</text>
    <text x="70" y="870" fill="#7E8B96" font-size="20">Parametrized Tailwind UI primitives.</text>

    <text x="34" y="914" fill="#D8E2EA" font-size="20" font-weight="700">Select evolution</text>
  </g>
</svg>
