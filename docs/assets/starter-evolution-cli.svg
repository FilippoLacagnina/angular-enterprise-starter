<svg width="760" height="780" viewBox="0 0 760 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Angular Enterprise Starter Evolution CLI preview</title>
  <desc id="desc">Terminal-style preview of the Angular Enterprise Starter Evolution CLI showing installable evolutions.</desc>
  <rect width="760" height="780" rx="22" fill="#17252B"/>
  <rect x="1" y="1" width="758" height="778" rx="21" stroke="#29424B" stroke-width="2"/>

  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="38" y="38" width="506" height="114" rx="6" stroke="#34D6C3" stroke-width="2.5"/>
    <text x="56" y="83" fill="#D8E2EA" font-size="20" font-weight="700">Angular Enterprise Starter</text>
    <text x="56" y="120" fill="#7E8B96" font-size="20">Evolution CLI</text>

    <text x="34" y="232" fill="#C8D3DC" font-size="20" font-weight="700">Composable Angular starter capabilities.</text>
    <text x="34" y="268" fill="#C8D3DC" font-size="20" font-weight="700">Preview first. </text>
    <text x="206" y="268" fill="#62D96B" font-size="20" font-weight="700">Apply</text>
    <text x="276" y="268" fill="#C8D3DC" font-size="20" font-weight="700"> when ready.</text>

    <line x1="34" y1="375" x2="726" y2="375" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>
    <text x="34" y="422" fill="#D8E2EA" font-size="20" font-weight="700">Choose an evolution</text>
    <line x1="34" y1="454" x2="726" y2="454" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>

    <text x="34" y="504" fill="#34D6C3" font-size="20" font-weight="700">1.</text>
    <text x="70" y="504" fill="#D8E2EA" font-size="20" font-weight="700">SignalStore</text>
    <text x="70" y="544" fill="#7E8B96" font-size="20">Feature-scoped NgRx SignalStore baseline.</text>

    <text x="34" y="584" fill="#34D6C3" font-size="20" font-weight="700">2.</text>
    <text x="70" y="584" fill="#D8E2EA" font-size="20" font-weight="700">Docker SSR</text>
    <text x="70" y="624" fill="#7E8B96" font-size="20">SSR-oriented Docker deployment baseline.</text>

    <text x="34" y="664" fill="#34D6C3" font-size="20" font-weight="700">3.</text>
    <text x="70" y="664" fill="#D8E2EA" font-size="20" font-weight="700">Bootstrap</text>
    <text x="70" y="704" fill="#7E8B96" font-size="20">Bootstrap design-system baseline.</text>

    <text x="34" y="754" fill="#D8E2EA" font-size="20" font-weight="700">Select evolution</text>
  </g>
</svg>
