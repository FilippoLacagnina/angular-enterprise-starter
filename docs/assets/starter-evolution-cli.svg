<svg width="760" height="1040" viewBox="0 0 760 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Angular Enterprise Starter Evolution CLI preview</title>
  <desc id="desc">Terminal-style preview of the Angular Enterprise Starter Evolution CLI showing installable Transloco i18n, Runtime Config, SignalStore, Docker SSR, Bootstrap, Tailwind and AI Genkit evolutions.</desc>
  <rect width="760" height="1040" rx="22" fill="#17252B"/>
  <rect x="1" y="1" width="758" height="1038" rx="21" stroke="#29424B" stroke-width="2"/>

  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="38" y="38" width="684" height="138" rx="6" stroke="#34D6C3" stroke-width="2.5"/>
    <text x="380" y="83" fill="#D8E2EA" font-size="25" font-weight="700" text-anchor="middle">ANGULAR ENTERPRISE STARTER</text>
    <text x="380" y="122" fill="#D8E2EA" font-size="20" font-weight="700" text-anchor="middle">Evolution CLI</text>
    <text x="380" y="150" fill="#7E8B96" font-size="18" text-anchor="middle">v0.9.0-alpha.0</text>

    <text x="34" y="250" fill="#C8D3DC" font-size="20" font-weight="700">Modular Angular starter capabilities.</text>
    <text x="34" y="286" fill="#C8D3DC" font-size="20" font-weight="700">Preview first. </text>
    <text x="206" y="286" fill="#62D96B" font-size="20" font-weight="700">Apply</text>
    <text x="276" y="286" fill="#C8D3DC" font-size="20" font-weight="700"> when ready.</text>

    <line x1="34" y1="380" x2="726" y2="380" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>
    <text x="34" y="427" fill="#D8E2EA" font-size="20" font-weight="700">Choose an evolution</text>
    <line x1="34" y1="459" x2="726" y2="459" stroke="#7E8B96" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>

    <text x="34" y="505" fill="#34D6C3" font-size="20" font-weight="700">1.</text>
    <text x="70" y="505" fill="#D8E2EA" font-size="20" font-weight="700">Transloco i18n</text>
    <text x="70" y="538" fill="#7E8B96" font-size="20">Configurable runtime i18n language assets.</text>

    <text x="34" y="575" fill="#34D6C3" font-size="20" font-weight="700">2.</text>
    <text x="70" y="575" fill="#D8E2EA" font-size="20" font-weight="700">Runtime Config</text>
    <text x="70" y="608" fill="#7E8B96" font-size="20">Deployable values.yml configuration.</text>

    <text x="34" y="645" fill="#34D6C3" font-size="20" font-weight="700">3.</text>
    <text x="70" y="645" fill="#D8E2EA" font-size="20" font-weight="700">SignalStore</text>
    <text x="70" y="678" fill="#7E8B96" font-size="20">Feature/root NgRx SignalStore baseline.</text>

    <text x="34" y="715" fill="#34D6C3" font-size="20" font-weight="700">4.</text>
    <text x="70" y="715" fill="#D8E2EA" font-size="20" font-weight="700">Docker SSR</text>
    <text x="70" y="748" fill="#7E8B96" font-size="20">SSR-oriented Docker deployment baseline.</text>

    <text x="34" y="785" fill="#34D6C3" font-size="20" font-weight="700">5.</text>
    <text x="70" y="785" fill="#D8E2EA" font-size="20" font-weight="700">Bootstrap</text>
    <text x="70" y="818" fill="#7E8B96" font-size="20">Parametrized Bootstrap UI primitives.</text>

    <text x="34" y="855" fill="#34D6C3" font-size="20" font-weight="700">6.</text>
    <text x="70" y="855" fill="#D8E2EA" font-size="20" font-weight="700">Tailwind</text>
    <text x="70" y="888" fill="#7E8B96" font-size="20">Parametrized Tailwind UI primitives.</text>

    <text x="34" y="925" fill="#34D6C3" font-size="20" font-weight="700">7.</text>
    <text x="70" y="925" fill="#D8E2EA" font-size="20" font-weight="700">AI Genkit</text>
    <text x="70" y="958" fill="#7E8B96" font-size="20">Server-side Genkit foundation with Gemini.</text>

    <text x="34" y="1010" fill="#D8E2EA" font-size="20" font-weight="700">Select evolution</text>
  </g>
</svg>
